# This is a basic workflow to help you get started with Actions

name: Docker Build

# Controls when the action will run. 
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number like v2.8.0 or 20210101'
        required: true
        default: 'v3.0.1'
      ref:
        description: 'Tag, branch or Full SHA to reference. Tags may not be updated so should use SHA for the tag.'
        required: false
        default: ''

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      # Runs a set of commands using the runners shell
      - name: Build
        run: |
          docker build -t ghcr.io/tl-its-umich-edu/udoit:${{ github.event.inputs.version }} .
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/tl-its-umich-edu/udoit:${{ github.event.inputs.version }}
